[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megatron-lm-activity-report"
version = "0.1.0"
description = "Generate bilingual, theme-oriented Megatron-LM activity reports"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  # DuckDB 1.3+ no longer publishes wheels compatible with the deployment
  # host's glibc 2.17; 1.2.x also works on current GitHub-hosted runners.
  "duckdb>=1.0,<1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
megatron-activity-report = "megatron_activity_report.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
