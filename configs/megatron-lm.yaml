source_repo: NVIDIA/Megatron-LM
destination_repo: NVIDIA/Megatron-LM
report_repo: lhb8125/megatron-lm-activity-report
report_branch: main
timezone: Asia/Shanghai

database_path: runtime/activity.duckdb
artifacts_dir: runtime/runs
state_path: state/issues.json
reports_dir: reports

github_workers: 8
request_timeout_seconds: 60
max_themes_per_section: 10

summarizer:
  provider: openai
  model: gpt-5
  reasoning_effort: medium
  batch_size: 60
  max_output_tokens: 24000

translation:
  preserve_terms:
    - Megatron-LM
    - Megatron Core
    - Megatron-FSDP
    - FSDP
    - MFSDP
    - CUDA Graph
    - THD
    - GTP
    - MTP
    - MoE
    - RL
    - GRPO
    - MIMO
    - DeepSeek-V4
    - Qwen3.5-VL
    - Gated Delta Product
    - Gated DeltaNet
    - HybridModel
    - Muon
    - NIXL
    - NCCL
    - SSM
    - KV cache
    - RoPE
    - MRoPE
    - MLA
    - CSA
    - DSA
    - DTensor
    - ZeRO
    - MXFP8
    - FP8
    - BF16
    - FP32
    - cuDNN
    - cuBLASLt
    - TileLang
    - Triton
    - CuTe DSL
    - PyTorch
    - OpenAI
    - vLLM
    - Transformer Engine
    - Energon
    - Top-K
    - LayerWise

filters:
  test_prefixes:
    - tests/
    - test/
  ci_prefixes:
    - .github/
    - ci/
    - tools/ci/
    - tests/test_utils/python_scripts/
